services:
  postiz:
    build:
      context: .
      dockerfile: Dockerfile.windows-dev
    container_name: postiz
    restart: unless-stopped
    environment:
      NODE_ENV: 'development'
      MAIN_URL: 'http://localhost:4200'
      FRONTEND_URL: 'http://localhost:4200'
      NEXT_PUBLIC_BACKEND_URL: 'http://localhost:3000'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random string before starting Postiz}
      DATABASE_URL: 'postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      POSTIZ_ENABLE_HEAVY_FEATURES: 'false'
      POSTIZ_ENABLE_SWAGGER: 'false'
      POSTIZ_RUN_DB_PUSH: 'true'
      PORT: '3000'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: '/uploads'
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - postiz-node-modules:/app/node_modules
      - postiz-uploads:/uploads
    ports:
      - '3000:3000'
      - '4200:4200'
    networks:
      - postiz-network
    depends_on:
      postiz-postgres:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-user -d postiz-db-local']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-volume:
    external: false
  postiz-node-modules:
    external: false
  postiz-uploads:
    external: false

networks:
  postiz-network:
    external: false
